# Copy to .github/dependabot.yml
# Keeps SHA-pinned actions and crates current, so pinning never means "stale".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      patch: { update-types: ["patch"] }
